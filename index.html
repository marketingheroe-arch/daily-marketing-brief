<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morning Brief - Marketing Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0d1117 0%,#161b22 50%,#0d1117 100%)}
.login-box{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:40px;width:360px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.login-box h1{font-size:28px;margin-bottom:6px;color:#58a6ff}
.login-box p{color:#8b949e;margin-bottom:24px;font-size:14px}
.login-box input{width:100%;padding:12px 16px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;font-size:15px;margin-bottom:16px;outline:none;transition:border .2s}
.login-box input:focus{border-color:#58a6ff}
.login-box button{width:100%;padding:12px;background:#238636;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.login-box button:hover{background:#2ea043}
.login-error{color:#f85149;font-size:13px;margin-top:8px;display:none}
#dashboard{display:none;max-width:1200px;margin:0 auto;padding:20px}
.dash-header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid #30363d;margin-bottom:24px}
.dash-header h1{font-size:24px;color:#58a6ff}
.dash-header .date{color:#8b949e;font-size:14px}
.dash-header .logout{background:none;border:1px solid #30363d;color:#8b949e;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.dash-header .logout:hover{color:#f85149;border-color:#f85149}
.client-card{background:#161b22;border:1px solid #30363d;border-radius:12px;margin-bottom:20px;overflow:hidden}
.client-header{padding:16px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .2s}
.client-header:hover{background:#1c2129}
.client-header h2{font-size:18px;color:#e6edf3;display:flex;align-items:center;gap:10px}
.client-header .risk-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;text-transform:uppercase}
.risk-high{background:#f8514922;color:#f85149;border:1px solid #f8514944}
.risk-medium{background:#d2992244;color:#d29922;border:1px solid #d2992244}
.risk-low{background:#23863644;color:#3fb950;border:1px solid #23863644}
.chevron{color:#8b949e;transition:transform .3s;font-size:20px}
.chevron.open{transform:rotate(180deg)}
.client-body{padding:0 20px 20px;display:none}
.client-body.open{display:block}
.section{margin-top:16px}
.section h3{font-size:14px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.alert-list,.news-list,.opp-list{list-style:none}
.alert-list li{background:#f8514911;border-left:3px solid #f85149;padding:10px 14px;margin-bottom:8px;border-radius:0 6px 6px 0;font-size:14px;color:#f0883e}
.news-item{padding:10px 0;border-bottom:1px solid #21262d;font-size:14px}
.news-item:last-child{border-bottom:none}
.news-item a{color:#58a6ff;text-decoration:none}
.news-item a:hover{text-decoration:underline}
.news-item .source{color:#8b949e;font-size:12px;margin-left:8px}
.news-item .keyword{background:#30363d;color:#8b949e;font-size:11px;padding:2px 6px;border-radius:4px;margin-left:6px}
.opp-list li{background:#23863611;border-left:3px solid #3fb950;padding:10px 14px;margin-bottom:8px;border-radius:0 6px 6px 0;font-size:14px;color:#7ee787}
.summary-text{font-size:14px;line-height:1.6;color:#c9d1d9;padding:8px 0}
#loading{display:none;text-align:center;padding:60px;color:#8b949e}
.spinner{display:inline-block;width:36px;height:36px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.no-data{text-align:center;padding:40px;color:#8b949e}
@media(max-width:768px){#dashboard{padding:12px}.login-box{width:90%;padding:28px}.dash-header{flex-direction:column;gap:12px;text-align:center}}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <h1>Morning Brief</h1>
    <p>Marketing Dashboard</p>
    <input type="password" id="password-input" placeholder="Contrase\u00f1a" autocomplete="off">
    <button onclick="tryLogin()">Acceder</button>
    <div class="login-error" id="login-error">Contrase\u00f1a incorrecta</div>
  </div>
</div>
<div id="loading"><div class="spinner"></div><p>Cargando datos...</p></div>
<div id="dashboard">
  <div class="dash-header">
    <div><h1>Morning Brief</h1><div class="date" id="dash-date"></div></div>
    <button class="logout" onclick="doLogout()">Cerrar sesion</button>
  </div>
  <div id="clients-container"></div>
  <div class="no-data" id="no-data" style="display:none">
    <p>No hay datos disponibles todavia.</p>
    <p style="margin-top:8px;font-size:13px">El workflow de GitHub Actions debe ejecutarse al menos una vez para generar datos.</p>
  </div>
</div>
<script>
const DIGEST_URL = 'https://raw.githubusercontent.com/marketingheroe-arch/daily-marketing-brief/main/output/latest_digest.json';

async function sha256(message) {
  const msgBuffer = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

async function tryLogin() {
  const pwd = document.getElementById('password-input').value;
  if (pwd === 'brief2026') {
    sessionStorage.setItem('mb_auth', '1');
    document.getElementById('login-screen').style.display = 'none';
    loadDashboard();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('password-input').value = '';
    document.getElementById('password-input').focus();
  }
}

document.getElementById('password-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') tryLogin();
});

function doLogout() {
  sessionStorage.removeItem('mb_auth');
  location.reload();
}

if (sessionStorage.getItem('mb_auth') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  loadDashboard();
}

async function loadDashboard() {
  document.getElementById('loading').style.display = 'block';
  try {
    const resp = await fetch(DIGEST_URL + '?t=' + Date.now());
    if (!resp.ok) throw new Error('No data');
    const data = await resp.json();
    renderDashboard(data);
  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('no-data').style.display = 'block';
  }
}

function renderDashboard(data) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  const date = data.date || new Date().toISOString().slice(0,10);
  document.getElementById('dash-date').textContent = formatDate(date) + ' \u2014 Generado: ' + formatTime(data.generated_at);
  const container = document.getElementById('clients-container');
  container.innerHTML = '';
  if (!data.clients || data.clients.length === 0) {
    document.getElementById('no-data').style.display = 'block';
    return;
  }
  data.clients.forEach((client, idx) => {
    const card = createClientCard(client, idx);
    container.appendChild(card);
  });
  const firstBody = container.querySelector('.client-body');
  const firstChevron = container.querySelector('.chevron');
  if (firstBody) { firstBody.classList.add('open'); firstChevron.classList.add('open'); }
}

function createClientCard(client, idx) {
  const card = document.createElement('div');
  card.className = 'client-card';
  const ai = client.ai_summary;
  const riskLevel = ai ? ai.risk_level || 'low' : 'low';
  const riskLabel = {low:'Bajo',medium:'Medio',high:'Alto'}[riskLevel] || riskLevel;
  const header = document.createElement('div');
  header.className = 'client-header';
  header.innerHTML = '<h2>' + getClientEmoji(client.vertical) + ' ' + client.client + ' <span class="risk-badge risk-' + riskLevel + '">' + riskLabel + '</span></h2><span class="chevron">\u25be</span>';
  header.onclick = () => {
    const body = card.querySelector('.client-body');
    const chev = card.querySelector('.chevron');
    body.classList.toggle('open');
    chev.classList.toggle('open');
  };
  const body = document.createElement('div');
  body.className = 'client-body';
  let html = '<div style="color:#8b949e;font-size:13px;margin-bottom:12px">' + client.vertical + ' \u00b7 ' + client.market + '</div>';
  if (ai) {
    if (ai.top_alerts && ai.top_alerts.length > 0) {
      html += '<div class="section"><h3>\ud83d\udea8 Alertas</h3><ul class="alert-list">';
      ai.top_alerts.forEach(a => { html += '<li>' + esc(a) + '</li>'; });
      html += '</ul></div>';
    }
    if (ai.industry_summary) html += '<div class="section"><h3>\ud83d\udcf0 Industria</h3><div class="summary-text">' + esc(ai.industry_summary) + '</div></div>';
    if (ai.competitor_moves) html += '<div class="section"><h3>\ud83c\udff7 Competencia</h3><div class="summary-text">' + esc(ai.competitor_moves) + '</div></div>';
    if (ai.platform_changes) html += '<div class="section"><h3>\ud83d\udd27 Plataformas</h3><div class="summary-text">' + esc(ai.platform_changes) + '</div></div>';
    if (ai.opportunities && ai.opportunities.length > 0) {
      html += '<div class="section"><h3>\ud83d\udca1 Oportunidades</h3><ul class="opp-list">';
      ai.opportunities.forEach(o => { html += '<li>' + esc(o) + '</li>'; });
      html += '</ul></div>';
    }
  }
  const newsId = 'raw-news-' + idx;
  if (ai) {
    html += '<div style="margin-top:16px"><a href="javascript:void(0)" onclick="document.getElementById(\'' + newsId + '\').style.display=document.getElementById(\'' + newsId + '\').style.display===\'none\'?\'block\':\'none\'" style="color:#8b949e;font-size:13px">\u25b8 Ver noticias originales</a></div>';
    html += '<div id="' + newsId + '" style="display:none">';
  }
  if (client.industry_news && client.industry_news.length > 0) {
    html += '<div class="section"><h3>\ud83d\udcf0 Noticias de Industria (' + client.industry_news.length + ')</h3>';
    client.industry_news.slice(0, 8).forEach(item => {
      html += '<div class="news-item"><a href="' + esc(item.link) + '" target="_blank" rel="noopener">' + esc(item.title) + '</a>';
      if (item.source) html += '<span class="source">' + esc(item.source) + '</span>';
      if (item.keyword) html += '<span class="keyword">' + esc(item.keyword) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  }
  if (client.competitor_news && client.competitor_news.length > 0) {
    html += '<div class="section"><h3>\ud83c\udff7 Noticias de Competencia (' + client.competitor_news.length + ')</h3>';
    client.competitor_news.slice(0, 6).forEach(item => {
      html += '<div class="news-item"><a href="' + esc(item.link) + '" target="_blank" rel="noopener">' + esc(item.title) + '</a>';
      if (item.competitor) html += '<span class="keyword">' + esc(item.competitor) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  }
  if (client.platform_updates && client.platform_updates.length > 0) {
    html += '<div class="section"><h3>\ud83d\udd27 Actualizaciones de Plataforma (' + client.platform_updates.length + ')</h3>';
    client.platform_updates.slice(0, 6).forEach(item => {
      html += '<div class="news-item"><a href="' + esc(item.link) + '" target="_blank" rel="noopener">' + esc(item.title) + '</a>';
      if (item.platform) html += '<span class="keyword">' + esc(item.platform) + '</span>';
      html += '</div>';
    });
    html += '</div>';
  }
  if (ai) html += '</div>';
  body.innerHTML = html;
  card.appendChild(header);
  card.appendChild(body);
  return card;
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getClientEmoji(vertical) {
  if (!vertical) return '\ud83d\udcca';
  const v = vertical.toLowerCase();
  if (v.includes('tea')) return '\ud83c\udf75';
  if (v.includes('coffee')) return '\u2615';
  if (v.includes('health') || v.includes('suplement')) return '\ud83c\udf3f';
  if (v.includes('finance') || v.includes('fp&a')) return '\ud83d\udcb0';
  if (v.includes('saas')) return '\ud83d\udcbb';
  return '\ud83d\udcca';
}

function formatDate(d) {
  try {
    const dt = new Date(d + 'T12:00:00');
    return dt.toLocaleDateString('es-ES', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  } catch(e) { return d; }
}

function formatTime(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
  } catch(e) { return ''; }
}
</script>
</body>
</html>
